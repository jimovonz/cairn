[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# A test that `return`s a verdict instead of asserting one CANNOT FAIL: pytest
# only warns. test_live_hooks had four contract checks silently passing that way
# since it was written, and the sole condition it could detect was a timeout.
# Promote the warning to an error so the whole class is impossible.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

markers =
    behavioural: normal input, verify correct output
    edge: empty, null, zero, boundary values
    error: invalid input, exceptions, failure modes
    adversarial: malformed data, unexpected types, contract violations
